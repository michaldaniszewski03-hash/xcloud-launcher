name: Build & Release

on:
  push:
    tags: ['v*']        # push a tag like v1.0.0 to publish a release
  workflow_dispatch:     # or run manually from the Actions tab (artifacts only)

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Build app
        run: npx vite build && npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # no code signing

      - uses: actions/upload-artifact@v4
        with:
          name: xcloud-launcher-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

